[package]
name = "axon-voice-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axon-voice = { path = "../axon-voice" }
axon-voice-protocol = { path = "../axon-voice-protocol" }
serde.workspace = true
serde_json.workspace = true

[features]
fake-host = []

[[bin]]
name = "axon-voice-host"
path = "src/main.rs"

[[bin]]
name = "axon-voice-fake-host"
path = "src/bin/fake_host.rs"
required-features = ["fake-host"]

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
