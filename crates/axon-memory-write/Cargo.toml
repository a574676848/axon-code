[package]
name = "axon-memory-write"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axon-domain = { path = "../axon-domain" }
axon-memory = { path = "../axon-memory" }
axon-crypto = { path = "../axon-crypto" }
axon-process = { path = "../axon-process" }

[dev-dependencies]
axon-test-support = { path = "../axon-test-support" }
tempfile.workspace = true

[features]
default = []
memory-text-index = ["axon-memory/memory-text-index"]
memory-vector-index = ["axon-memory/memory-vector-index"]
memory-indexes = ["memory-text-index", "memory-vector-index"]

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true
