# Axon 编译检查流水线
# 触发条件：push 到 master、PR、push 以 v 开头的 tag（如 v0.2.0）、人工触发
#
# 频率治理（避免"每次提交都跑半小时"）：
#   1. concurrency 取消同一 ref 上已被新提交取代的运行，连推多次只跑最后一次。
#   2. changes 任务先做路径判定：改动全部落在 docs/ 与根级 Markdown 时，
#      Check 矩阵立即收工，但三个必需检查名照常上报 success，不阻塞合并。
#   3. Draft PR 不跑矩阵，转为 ready_for_review 时才跑。
#
# 注意：不要改用 workflow 级 paths-ignore。那样文档 PR 的必需检查永远不会上报，
# 分支保护会把合并永久卡在 Waiting for status to be reported。
# runner 与 action 版本（对应 2026-10 的 runner 镜像与 Node 运行时告警）：
#   1. 矩阵里的 os 只作为**必需的检查名**（`Check (ubuntu-latest)` 等），实际镜像由
#      runner 字段固定到具体版本：ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26，
#      latest 自动漂移会同时改变运行时行为与分支保护的比对上下文。
#   2. GitHub 已弃用 Node 20，checkout / setup-node 全部升到 v5（Node 24）。
#   3. macOS 14 镜像已于 2026-11-02 全量退役（见 actions/runner-images#15226），
#      继续用 macos-14 会调度不到 runner 并在数秒内被平台取消；这里固定到
#      macos-15-intel，保持 x64 架构不变、只把系统版本升一档，减少架构切换变量。
name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 上增量编译只会更慢并让缓存膨胀（rust-cache 同样建议 CI 关闭），
  # 增量产物由本机的 target/ 承担，与门禁用例无关。
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 判定是否触及代码或构建配置
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # 分支新建、tag 首次推送与人工触发时没有可比较的基线，按有代码改动处理
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit, running full matrix"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base commit not fetched, running full matrix"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          printf '%s\n' "$changed"

          # 只有 docs/ 与根级社区文档算纯文档改动；其余任何路径都跑完整矩阵
          code_paths=$(printf '%s\n' "$changed" |
            grep -vE '^(docs/|(README|AGENTS|CHANGELOG|CONTRIBUTING|SECURITY|CODE_OF_CONDUCT)\.md$)' || true)

          if [ -n "${code_paths}" ]; then
            echo "code change detected"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation-only change, skipping matrix"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          # os 是分支保护比对的必需检查名，必须保持不变；runner 才是真实镜像。
          # timeout 按腿给：Rust 全量编译 + 测试在 Windows / macOS 上明显更慢，
          # 首次无缓存时实测会撞满 45 分钟（ubuntu 约 41 分钟跑完 24 步）。
          - os: ubuntu-latest
            runner: ubuntu-24.04
            python: python3
            timeout: 60
          - os: windows-latest
            runner: windows-2022
            python: python
            timeout: 90
          - os: macos-latest
            runner: macos-15-intel
            python: python3
            timeout: 90
    runs-on: ${{ matrix.runner }}
    # 单腿墙钟上限：卡死的用例或交互式进程不该长期占用 runner。
    # 数值来自实测：ubuntu 41 分钟通过；windows/macos 无缓存时 45 分钟不够，
    # 会被平台直接掐断并记为 cancelled（看起来像取消，其实是超时）。
    timeout-minutes: ${{ matrix.timeout }}

    steps:
      - uses: actions/checkout@v5
        with:
          # 空白与冲突痕迹检查以 HEAD^ 为基线，浅克隆（默认 depth 1）下没有父母提交。
          fetch-depth: 2

      # 纯文档改动不进入构建矩阵。这里刻意不用 job 级 if 跳过整个作业：
      # 被跳过的必需检查不会上报 success，分支保护会卡住合并。
      - name: 文档改动跳过构建矩阵
        if: needs.changes.outputs.code != 'true'
        run: echo "documentation-only change, build matrix skipped"

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          shared-key: cargo-${{ matrix.os }}
          cache-targets: true
          # 只让 master 写缓存：PR 只读同一份，避免每次 PR 都覆盖导致互相抖动与提前淘汰。
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # apt 依赖（webkit / rsvg / dbus 等）每次重装约 30s，按包列表缓存后命中即只做本地安装。
      - name: 安装 Linux 系统依赖 (Tauri 2 与系统凭据库)
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          # libdbus-1-dev 是桌面端 Linux 凭据库（Secret Service）的构建依赖。
          # libappindicator3-dev 在 Ubuntu 24.04 已改名为 libayatana-appindicator3-dev，
          # 两个名字依次尝试，避免包名漂移把整步安装拖挂。
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev
          sudo apt-get install -y libayatana-appindicator3-dev ||
            sudo apt-get install -y libappindicator3-dev

      - name: 准备 Node 环境
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # 缓存 npm 下载目录：`npm ci` 严格按锁文件还原，命中缓存时只剩本地链接。
          cache: npm
          cache-dependency-path: crates/axon-desktop/ui/package-lock.json

      - name: 前端构建 (axon-desktop UI)
        if: needs.changes.outputs.code == 'true'
        run: |
          npm --prefix crates/axon-desktop/ui ci
          npm --prefix crates/axon-desktop/ui run build

      - name: 校验 UI 契约门禁
        if: needs.changes.outputs.code == 'true'
        run: ${{ matrix.python }} tools/verify_ui_contract.py

      # 风格检查与前端单测必须在这里真跑：只构建不检查等于把 lint 与断言留给本地。
      - name: 前端风格检查与单测
        if: needs.changes.outputs.code == 'true'
        run: |
          npm --prefix crates/axon-desktop/ui run lint
          npm --prefix crates/axon-desktop/ui test

      # 性能契约：与基线比较，回退即失败；尚未人工测量的项在 CI 里放行并逐项列出。
      - name: 性能契约门禁
        if: needs.changes.outputs.code == 'true'
        run: ${{ matrix.python }} tools/verify_performance.py --allow-incomplete

      - name: 格式检查
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --all --check

      # 空白与冲突痕迹检查：只看本次推送范围，历史上已入库的行不再翻旧账。
      - name: 空白与冲突痕迹检查
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          # 浅克隆或根提交时 HEAD^ 不存在；git rev-parse 会把未解析的参数原样回显到 stdout，
          # 于是 $(...) 会捕获到两行，后续 diff 直接 fatal。--verify --quiet 让失败时输出为空。
          base=$(git rev-parse --verify --quiet HEAD^ || git rev-parse HEAD)
          git diff --check "$base" HEAD

      - name: 编译期 lint 豁免检查
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: bash tools/check-no-lint-allows.sh

      # 依赖解析锁在 Cargo.lock：CI 不做实时重新解析，避免上游新版本发布
      # 在无代码改动时把已绿的 master 变成红。升级依赖走 dependabot/显式 PR。
      #
      # `cargo check` 与 clippy 的分工：clippy 是严格超集，但两者失败信息不同，
      # 门禁矩阵要求两条都在，缺少 check 时「只有 clippy 报了才有人管」。
      - name: 编译检查
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          set -o pipefail
          if cargo check --locked --workspace --all-features 2>&1 | tee cargo-check.log; then
            exit 0
          fi
          detail=$(grep -A6 -m1 -E '^error' cargo-check.log | tr '\n' ' ')
          echo "::error title=cargo-check::${detail:0:900}"
          exit 1

      - name: Clippy 静态分析
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: 单元测试
        if: needs.changes.outputs.code == 'true'
        run: cargo test --locked --workspace --all-features

      - name: CLI release smoke
        if: needs.changes.outputs.code == 'true'
        run: ${{ matrix.python }} tools/verify_cli_release_smoke.py

      - name: Daemon 与 doctor smoke
        if: needs.changes.outputs.code == 'true'
        run: cargo run -p axon-cli --all-features -- doctor --check runtime

      - name: TUI three-region smoke
        if: needs.changes.outputs.code == 'true'
        run: ${{ matrix.python }} tools/verify_tui_smoke.py
