# Axon 正式发布流水线
# 触发条件：push 以 v 开头的 tag（如 v0.2.0）+ 人工触发
# 前置门禁：gate job 会先确认该提交的 CI 已经全绿，未通过则整条发布流水线拒绝执行
# 产物：三平台六 target 的预编译二进制（后端 axon 与桌面端 axon-desktop 分开打包）+ MSI/pkg/deb + SHA256SUMS
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────
  # 阶段零：发布前置门禁——该提交的 CI 必须已经通过
  # ──────────────────────────────────────────────
  gate:
    name: Gate (CI green)
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: 校验该提交的 CI 已通过
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while :; do
            runs=$(gh run list --repo "$REPO" --commit "$SHA" --workflow ci.yml \
                     --limit 20 --json status,conclusion 2>/dev/null || echo '[]')
            ok=$(printf '%s' "$runs" | python3 -c 'import json,sys;print(sum(1 for r in json.load(sys.stdin) if r.get("conclusion")=="success"))')
            pending=$(printf '%s' "$runs" | python3 -c 'import json,sys;print(sum(1 for r in json.load(sys.stdin) if r.get("status")!="completed"))')
            bad=$(printf '%s' "$runs" | python3 -c 'import json,sys;print(sum(1 for r in json.load(sys.stdin) if r.get("conclusion") in ("failure","cancelled","timed_out","startup_failure")))')
            echo "CI runs for ${SHA}: success=${ok} pending=${pending} failed=${bad}"
            if [ "${ok}" -gt 0 ]; then
              echo "CI 已通过，放行发布"
              exit 0
            fi
            if [ "${pending}" -eq 0 ]; then
              echo "::error::该提交没有通过的 CI 记录（failed=${bad}），拒绝发布"
              exit 1
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::等待 CI 超时（30 分钟），拒绝发布"
              exit 1
            fi
            sleep 30
          done

  # ──────────────────────────────────────────────
  # 阶段一：多平台并行构建 + 打包
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
            desktop: 'true'

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            archive: tar.gz
            desktop: 'true'

          # macOS Intel（macos-13 已退役，改用 macos-15-intel 保持 x64 架构不变）
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ''
            archive: tar.gz
            desktop: 'true'

          # Linux x64 (glibc)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ''
            archive: tar.gz
            desktop: 'true'

          # Linux ARM64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ''
            archive: tar.gz
            desktop: 'true'

          # Linux x64 (musl — Alpine/静态链接)。musl 没有 webkit2gtk，只能出后端。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            ext: ''
            archive: tar.gz
            desktop: 'false'

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 补齐目标标准库
        # dtolnay/rust-toolchain 的 targets 只作用于默认 toolchain，而仓库 rust-toolchain.toml
        # 固定了 channel；在仓库目录内显式补一次，避免 musl 这类非宿主 target 缺 core 库。
        run: rustup target add ${{ matrix.target }}

      - name: 安装 musl 工具链（Linux musl only）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: 缓存 Cargo 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          shared-key: release-${{ matrix.target }}
          cache-targets: true

      - name: 安装 Linux 系统依赖 (Tauri 桌面端)
        if: runner.os == 'Linux' && matrix.desktop == 'true'
        shell: bash
        run: |
          sudo apt-get update
          # 桌面端（axon-desktop）在 Linux 链接 webkit2gtk 与 rsvg，缺依赖会直接编译失败。
          # libappindicator3-dev 在 Ubuntu 24.04 已改名为 libayatana-appindicator3-dev。
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev
          sudo apt-get install -y libayatana-appindicator3-dev ||
            sudo apt-get install -y libappindicator3-dev

      - name: 准备 Node 环境 (axon-desktop UI)
        if: matrix.desktop == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 axon-desktop 前端
        if: matrix.desktop == 'true'
        run: |
          npm --prefix crates/axon-desktop/ui ci
          npm --prefix crates/axon-desktop/ui run build

      - name: 编译 release 二进制（后端 + 桌面端）
        shell: bash
        run: |
          # musl 腿只出后端：webkit2gtk 没有 musl 构建，GUI 无法静态链接。
          if [ "${{ matrix.desktop }}" = "true" ]; then
            cargo build -p axon-cli -p axon-launcher -p axon-desktop --release --target ${{ matrix.target }} --all-features
          else
            cargo build -p axon-cli -p axon-launcher --release --target ${{ matrix.target }} --all-features
          fi

      - name: CLI doctor smoke
        run: cargo run -p axon-cli -- doctor --check provider

      # ── Unix 打包：后端与桌面端分开出包 ──────
      - name: 打包 tar.gz（Unix）
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          # 产物命名统一为 <name>-<version>-<target>：name 只有 axon（后端）与 axon-desktop（桌面端），
          # 版本不带 v 前缀，与 msi / pkg / deb 对齐。
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="axon-${VERSION}-${{ matrix.target }}"
          DESKTOP_NAME="axon-desktop-${VERSION}-${{ matrix.target }}"

          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/axon" "dist/${NAME}/"
          mkdir -p "dist/${NAME}/launcher"
          cp "target/${{ matrix.target }}/release/axon-launcher" "dist/${NAME}/launcher/"
          cp README.md "dist/${NAME}/" 2>/dev/null || true
          mkdir -p "dist/${NAME}/docs/skills"
          cp -R "docs/skills/operate-axon" "dist/${NAME}/docs/skills/"
          mkdir -p "dist/${NAME}/assets/defaults"
          cp "assets/defaults/SOUL.md" "dist/${NAME}/assets/defaults/"
          tar czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          sha256sum "dist/${NAME}.tar.gz" | awk '{print $1}' > "dist/${NAME}.tar.gz.sha256"

          mkdir -p "dist/${DESKTOP_NAME}"
          cp "target/${{ matrix.target }}/release/axon-desktop" "dist/${DESKTOP_NAME}/"
          cp README.md "dist/${DESKTOP_NAME}/" 2>/dev/null || true
          tar czf "dist/${DESKTOP_NAME}.tar.gz" -C dist "${DESKTOP_NAME}"
          sha256sum "dist/${DESKTOP_NAME}.tar.gz" | awk '{print $1}' > "dist/${DESKTOP_NAME}.tar.gz.sha256"

          echo "ASSET_PATH=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_SHA=dist/${NAME}.tar.gz.sha256" >> "$GITHUB_ENV"

      # ── Windows 打包：后端 zip 与桌面端 zip 分开 ──
      - name: 打包 zip（Windows）
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $name = "axon-$version-${{ matrix.target }}"
          $desktopName = "axon-desktop-$version-${{ matrix.target }}"

          # 后端包：CLI + launcher + 技能文档 + 默认 Soul + scoop 安装脚本
          New-Item -Force "dist/$name" -Type Directory | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/axon.exe" "dist/$name/"
          New-Item -Force "dist/$name/launcher" -Type Directory | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/axon-launcher.exe" "dist/$name/launcher/"
          Copy-Item "README.md" "dist/$name/" -ErrorAction SilentlyContinue
          New-Item -Force "dist/$name/docs/skills" -Type Directory | Out-Null
          Copy-Item "docs/skills/operate-axon" "dist/$name/docs/skills/" -Recurse -Force
          New-Item -Force "dist/$name/assets/defaults" -Type Directory | Out-Null
          Copy-Item "assets/defaults/SOUL.md" "dist/$name/assets/defaults/"
          Copy-Item "installer/scoop/axon-scoop-install.ps1" "dist/$name/"
          Compress-Archive "dist/$name" "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() |
            Out-File -NoNewline "dist/$name.zip.sha256"

          # 桌面端包：GUI 单独分发，避免把两种运行时塞进同一个 zip
          New-Item -Force "dist/$desktopName" -Type Directory | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/axon-desktop.exe" "dist/$desktopName/"
          Copy-Item "README.md" "dist/$desktopName/" -ErrorAction SilentlyContinue
          Compress-Archive "dist/$desktopName" "dist/$desktopName.zip"
          (Get-FileHash "dist/$desktopName.zip" -Algorithm SHA256).Hash.ToLower() |
            Out-File -NoNewline "dist/$desktopName.zip.sha256"

          "ASSET_PATH=dist/$name.zip" | Out-File -Append $env:GITHUB_ENV
          "ASSET_SHA=dist/$name.zip.sha256" | Out-File -Append $env:GITHUB_ENV

      # ── Windows 代码签名（Authenticode）───────
      - name: Windows Authenticode 签名
        if: matrix.os == 'windows-latest' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # 将 Base64 证书还原为 .pfx 文件
          $certPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          # 对二进制签名（Microsoft Trusted Root Program EV 证书）
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" `
            sign /fd SHA256 /f $certPath /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 `
            "target/${{ matrix.target }}/release/axon.exe"
          Remove-Item $certPath -Force
        continue-on-error: true

      # ── macOS 代码签名 + 公证 ──────────────────
      - name: macOS codesign
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          if [ -n "${MACOS_CERT_BASE64}" ]; then
            echo "${MACOS_CERT_BASE64}" | base64 -d > "${RUNNER_TEMP}/devid.p12"
            security create-keychain -p "" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "" build.keychain
            security import "${RUNNER_TEMP}/devid.p12" -k build.keychain \
              -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
            codesign --timestamp --options runtime \
              --sign "Developer ID Application: ${MACOS_TEAM_ID}" \
              "target/${{ matrix.target }}/release/axon"
            rm -f "${RUNNER_TEMP}/devid.p12"
          fi
        continue-on-error: true
        shell: bash

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # 阶段一（续）：macOS .pkg 打包
  # ──────────────────────────────────────────────
  macos_pkg:
    name: Build macOS .pkg (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 补齐目标标准库
        # dtolnay/rust-toolchain 的 targets 只作用于默认 toolchain，而仓库 rust-toolchain.toml
        # 固定了 channel；在仓库目录内显式补一次，避免 musl 这类非宿主 target 缺 core 库。
        run: rustup target add ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-pkg
          shared-key: release-${{ matrix.target }}
          cache-targets: true

      - name: 编译 macOS release 二进制
        run: cargo build -p axon-cli -p axon-launcher --release --target ${{ matrix.target }} --all-features

      - name: 构建 .pkg
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="axon-${VERSION}-${{ matrix.target }}"
          BINARY="target/${{ matrix.target }}/release/axon"
          LAUNCHER="target/${{ matrix.target }}/release/axon-launcher"
          bash installer/macos/build-pkg.sh "${VERSION}" "${BINARY}" "${LAUNCHER}" "${NAME}"

      - name: 生成 SHA256
        shell: bash
        run: |
          NAME="axon-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          shasum -a 256 "dist/${NAME}.pkg" | awk '{print $1}' > "dist/${NAME}.pkg.sha256"

      - name: macOS .pkg 公证
        if: env.MACOS_NOTARY_PASSWORD != ''
        shell: bash
        env:
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_USER: ${{ secrets.MACOS_NOTARY_USER }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          NAME="axon-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bash installer/macos/notarize.sh "dist/${NAME}.pkg"
        continue-on-error: true

      - name: 上传 .pkg 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-pkg-${{ matrix.target }}
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # 阶段一（续）：Linux .deb 打包
  # ──────────────────────────────────────────────
  linux_deb:
    name: Build Linux .deb (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 补齐目标标准库
        # dtolnay/rust-toolchain 的 targets 只作用于默认 toolchain，而仓库 rust-toolchain.toml
        # 固定了 channel；在仓库目录内显式补一次，避免 musl 这类非宿主 target 缺 core 库。
        run: rustup target add ${{ matrix.target }}

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-deb
          shared-key: release-${{ matrix.target }}
          cache-targets: true

      - name: 编译 Linux release 二进制
        run: cargo build -p axon-cli -p axon-launcher --release --target ${{ matrix.target }} --all-features

      - name: 构建 .deb
        shell: bash
        run: |
          export AXON_VERSION="${GITHUB_REF_NAME#v}"
          export AXON_ARCH="${{ matrix.arch }}"
          export AXON_BINARY="target/${{ matrix.target }}/release/axon"
          export AXON_LAUNCHER="target/${{ matrix.target }}/release/axon-launcher"
          bash installer/linux/build-deb.sh

      - name: 生成 SHA256
        shell: bash
        run: |
          NAME="axon-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          sha256sum "dist/${NAME}.deb" | awk '{print $1}' > "dist/${NAME}.deb.sha256"

      - name: 上传 .deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-deb-${{ matrix.target }}
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # 阶段二：Windows MSI 打包（依赖 WiX）
  # ──────────────────────────────────────────────
  msi:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: build

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-msi
          shared-key: release-x86_64-pc-windows-msvc
          cache-targets: true

      - name: 准备 Node 环境并构建前端 (axon-desktop UI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 axon-desktop 前端
        run: |
          npm --prefix crates/axon-desktop/ui ci
          npm --prefix crates/axon-desktop/ui run build

      - name: 编译 Windows release 二进制
        run: cargo build -p axon-cli -p axon-launcher -p axon-desktop --release --target x86_64-pc-windows-msvc --all-features

      - name: 安装 WiX Toolset v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: 构建 MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          # dist 目录不会凭空存在：后续的 current.json / MSI / 校验和都往这里写。
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $binaryPath = "target\x86_64-pc-windows-msvc\release\axon.exe"
          $desktopBinaryPath = "target\x86_64-pc-windows-msvc\release\axon-desktop.exe"
          $launcherPath = "target\x86_64-pc-windows-msvc\release\axon-launcher.exe"
          $manifestPath = "dist\current.json"
          @{ versionId = $version } | ConvertTo-Json -Compress | Set-Content -NoNewline $manifestPath
          $msiPath = "dist/axon-$version-x86_64-pc-windows-msvc.msi"
          wix build installer/windows/axon.wxs `
            -ext WixToolset.UI.wixext `
            -culture zh-CN `
            -loc installer/windows/zh-CN.wxl `
            -d "Version=$version" `
            -d "BinaryPath=$binaryPath" `
            -d "DesktopBinaryPath=$desktopBinaryPath" `
            -d "LauncherPath=$launcherPath" `
            -d "CurrentManifestPath=$manifestPath" `
            -d "IconPath=crates\axon-desktop\icons\icon.ico" `
            -o $msiPath
          $hash = (Get-FileHash $msiPath -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -NoNewline "$msiPath.sha256"

      - name: 上传 MSI 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-msi
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # 阶段三：聚合所有产物 → 生成 SHA256SUMS → 发布 Release
  # ──────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, msi, macos_pkg, linux_deb]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: all-dist/
          merge-multiple: true

      - name: 同步包管理与安装器元数据
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File scripts/sync-release-metadata.ps1 `
            -Version "${{ github.ref_name }}" `
            -DistDir "all-dist"

      - name: 生成聚合 SHA256SUMS
        run: |
          cd all-dist
          find . \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.msi" -o -name "*.pkg" -o -name "*.deb" \) \
            -not -name "*.sha256" | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Linux GPG 分离签名
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import
          cd all-dist
          gpg --batch --passphrase "${GPG_PASSPHRASE}" \
            --pinentry-mode loopback --armor \
            --detach-sign SHA256SUMS
          echo "SHA256SUMS.asc 已生成"
        continue-on-error: true

      - name: 提取版本号与 Changelog
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "Axon ${{ github.ref_name }}"
          body: |
            ## Axon ${{ github.ref_name }}

            ### 安装方式

            **macOS / Linux — 一键安装：**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/a574676848/axon-code/master/scripts/install.sh | sh
            ```

            **Windows PowerShell — 一键安装：**
            ```powershell
            irm https://raw.githubusercontent.com/a574676848/axon-code/master/scripts/install.ps1 | iex
            ```

            **Windows — MSI 安装包：**
            下载下方 `axon-${{ github.ref_name }}-x86_64-pc-windows-msvc.msi` 双击安装。

            **macOS — .pkg 安装包：**
            下载下方对应架构的 `.pkg` 文件双击安装。

            **Linux — .deb 安装包：**
            ```sh
            sudo dpkg -i axon-*.deb
            ```

