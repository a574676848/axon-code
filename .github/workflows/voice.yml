# 语音 crate 的定向门禁：默认 feature 与 fake-host feature 各跑一次。
name: Voice

on:
  push:
    branches:
      - master
      - 'feat/voice*'
    paths:
      - 'crates/axon-voice/**'
      - 'crates/axon-voice-protocol/**'
      - 'crates/axon-voice-host/**'
      - '.github/workflows/voice.yml'
  pull_request:
    paths:
      - 'crates/axon-voice/**'
      - 'crates/axon-voice-protocol/**'
      - 'crates/axon-voice-host/**'
      - '.github/workflows/voice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  voice:
    name: Voice crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p axon-voice -p axon-voice-protocol -p axon-voice-host --all-targets --features fake-host -- -D warnings
      - name: Test (default features)
        run: cargo test -p axon-voice -p axon-voice-protocol -p axon-voice-host
      - name: Test (fake host)
        run: cargo test -p axon-voice-host --features fake-host
