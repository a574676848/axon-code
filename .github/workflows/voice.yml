# 语音 crate 的定向门禁：领域合同、协议帧与桥状态机。
# 本机模型宿主已移除，识别与合成由云端提供方承担，这里只跑纯逻辑与协议层。
name: Voice

on:
  push:
    branches:
      - master
      - 'feat/voice*'
    paths:
      - 'crates/axon-voice/**'
      - 'crates/axon-voice-protocol/**'
      - 'crates/axon-voice-bridge/**'
      - '.github/workflows/voice.yml'
  pull_request:
    paths:
      - 'crates/axon-voice/**'
      - 'crates/axon-voice-protocol/**'
      - 'crates/axon-voice-bridge/**'
      - '.github/workflows/voice.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  voice:
    name: Voice crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p axon-voice -p axon-voice-protocol -p axon-voice-bridge --all-targets -- -D warnings
      - name: Test
        run: cargo test -p axon-voice -p axon-voice-protocol -p axon-voice-bridge
